[package]
name = "rust01"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
deadpool-postgres = "0.14.1"
dotenv = "0.15.0"
env_logger = "0.11.8"
log = "0.4.27"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.46.1", features = ["full"] }
tokio-postgres = "0.7.13"
tracing-actix-web = "0.7.19"
tracing-subscriber = { version="0.3.19", features=["env-filter","tracing-log","time","fmt","json"]}
